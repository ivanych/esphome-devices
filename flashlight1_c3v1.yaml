substitutions:
  comment: "Flashlight1 (Фонарик с кнопкой, индикатором и статусным индикатором)
            на C3V1 (ESP32-C3 Luatos CORE-ESP32)"



packages:
  common:
    url: https://github.com/ivanych/esphome-common
    ref: 2.0.0
    files:
      - common.yaml
      - sensors.yaml
      - time.yaml

  # Фонарик
  flashlight1: !include
    file: units/flashlight1.yaml
    vars:
      # Фонарик
      flashlight:
        target:
          id: mono_led

      # Кнопка
      button:
        source:
          id: key

      # Индикатор
      indicator:
        target:
          id: mono_led
          number: 2

      # Статусный индикатор
      status:
        target:
          id: mono_led
          number: 2

  boards:
    url: https://github.com/ivanych/esphome-boards
    ref: 5.0.0
    files:
      - path: c3v1.yaml
        vars:
          use_mono_led_1: true
          use_mono_led_2: true
          use_key: true

    #!include
    #file: ../esphome-boards/c3v1.yaml
    #vars:
    #  use_mono_led_1: true
    #  use_mono_led_2: true
    #  use_key: true
