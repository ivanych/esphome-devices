substitutions:
  comment: "Flashlight1 (Фонарик с кнопкой, [-индикатором] и статусным индикатором)
            на S1V3 (ESP32 NodeMCU-32S)"

packages:
  common:
    url: https://github.com/ivanych/esphome-common
    ref: 2.0.0
    files:
      - common.yaml
      - sensors.yaml
      - time.yaml

  # Фонарик
  flashlight1: !include
    file: units/flashlight1.yaml
    vars:
      # Фонарик
      flashlight:
        target:
          id: mono_led

      # Кнопка
      button:
        source:
          id: key

      # Индикатор
      #indicator:
      #  target:
      #    id: mono_led

      # Статусный индикатор
      status:
        target:
          id: mono_led

  boards:
    url: https://github.com/ivanych/esphome-boards
    ref: 5.0.0
    files:
      # Плата S1V3
      - path: s1v3.yaml
        vars:
          use_mono_led: true
          use_key: true

    #!include
    #file: ../esphome-boards/s1v3.yaml
    #vars:
    #  use_mono_led: true
    #  use_key: true
